<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Rockies Leukemia Foundation — Coming Soon</title>
<meta name="description" content="The Northern Rockies Leukemia Foundation supports earlier detection of leukemia across Montana, Idaho and Wyoming. Website coming soon.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="mark.svg">
<meta property="og:title" content="Northern Rockies Leukemia Foundation">
<meta property="og:description" content="Supporting earlier detection of leukemia across Montana, Idaho and Wyoming.">
<style>
  :root { --ink:#3f3a35; --muted:#6E6760; --accent:#B5123F; --bg:#ffffff; --rule:#ece7e2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 16px; text-align:center;
  }
  main { max-width:560px; width:100%; }
  .logo { width:min(300px, 72vw); height:auto; display:block; margin:0 auto 28px; }
  .bar { width:56px; height:3px; margin:0 auto 24px;
         background:linear-gradient(90deg,#B5123F,#E0432F,#F39A2B); border-radius:2px; }
  h1 { font-weight:400; font-size:clamp(22px,4.2vw,30px); letter-spacing:.02em; margin:0 0 14px; }
  p { font-size:17px; line-height:1.6; color:var(--muted); margin:0 auto 10px; max-width:460px; }
  .states { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size:12px;
            letter-spacing:.24em; text-transform:uppercase; color:var(--muted); margin-top:26px; }
  footer { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size:12px;
           color:#9a938c; margin-top:48px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Northern Rockies Leukemia Foundation">
  <div class="bar" aria-hidden="true"></div>
  <h1>Our website is coming soon</h1>
  <p>The Northern Rockies Leukemia Foundation is being formed to support earlier detection of leukemia for families in rural communities.</p>
  <div class="states">Montana &middot; Idaho &middot; Wyoming</div>
</main>
<footer>&copy; 2026 Northern Rockies Leukemia Foundation</footer>
</body>
</html>
